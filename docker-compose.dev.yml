services:
  backend:
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CMS_URL: http://localhost:1337
      API_INTERNAL_URL: http://backend:8000
      CMS_INTERNAL_URL: http://strapi:1337
    command: sh -c "rm -rf .next && test -f 'app/(dashboard)/activities/page.tsx' && test -f 'app/(dashboard)/news/page.tsx' && npm run dev"

  strapi:
    build:
      context: ./cms
      dockerfile: Dockerfile.dev
    volumes:
      - ./cms:/opt/app
      - /opt/app/node_modules
      - strapi_uploads:/opt/app/public/uploads
    environment:
      NODE_ENV: development
      APP_KEYS: devKeyA1234567890abcdefghijklmnopqrstuvwxyz,devKeyB1234567890abcdefghijklmnopqrstuvwxyz
      API_TOKEN_SALT: dev-api-token-salt-change-me
      ADMIN_JWT_SECRET: dev-admin-jwt-secret-change-me
      JWT_SECRET: dev-jwt-secret-change-me
      TRANSFER_TOKEN_SALT: dev-transfer-token-salt-change-me
