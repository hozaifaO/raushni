services:
  backend:
    environment:
      ENVIRONMENT: development
      DD_ENV: development
      DEBUG: "true"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://raushni-dev.com}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    environment:
      NODE_ENV: development
      DD_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.raushni-dev.com}
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-https://cms.raushni-dev.com}
      NEXT_PUBLIC_REQUIRE_AUTH: ${NEXT_PUBLIC_REQUIRE_AUTH:-false}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://raushni-dev.com}
      NEXTAUTH_ADMIN_EMAIL: ${NEXTAUTH_ADMIN_EMAIL:-admin@raushni.com}
      NEXTAUTH_ADMIN_PASSWORD: ${NEXTAUTH_ADMIN_PASSWORD:-ChangeMe@12345}
      NEXTAUTH_STAFF_EMAIL: ${NEXTAUTH_STAFF_EMAIL:-staff@raushni.com}
      NEXTAUTH_STAFF_PASSWORD: ${NEXTAUTH_STAFF_PASSWORD:-ChangeMe@12345}
      API_INTERNAL_URL: http://backend:8000
      CMS_INTERNAL_URL: http://strapi:1337
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    command: sh -c "rm -rf .next && test -f 'app/(public)/activities/page.tsx' && test -f 'app/(public)/news/page.tsx' && test -f 'app/(dashboard)/dashboard/internships/page.tsx' && npm run dev"

  strapi:
    build:
      context: ./cms
      dockerfile: Dockerfile.dev
    volumes:
      - ./cms:/opt/app
      - /opt/app/node_modules
      - strapi_uploads:/opt/app/public/uploads
    environment:
      NODE_ENV: development
      DD_ENV: development
      PUBLIC_URL: ${CMS_PUBLIC_URL:-https://cms.raushni-dev.com}
      ADMIN_URL: ${STRAPI_ADMIN_URL:-https://cms.raushni-dev.com/admin}
      CORS_ORIGINS: ${CMS_CORS_ORIGINS:-https://raushni-dev.com,https://www.raushni-dev.com,https://api.raushni-dev.com,https://cms.raushni-dev.com,http://localhost,http://localhost:3000,http://localhost:1337}
      APP_KEYS: ${STRAPI_APP_KEYS:-devKeyA1234567890abcdefghijklmnopqrstuvwxyz,devKeyB1234567890abcdefghijklmnopqrstuvwxyz}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:-dev-api-token-salt-change-me}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:-dev-admin-jwt-secret-change-me}
      JWT_SECRET: ${STRAPI_JWT_SECRET:-dev-jwt-secret-change-me}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:-dev-transfer-token-salt-change-me}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
