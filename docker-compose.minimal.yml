services:
  postgres:
    image: postgres:15-alpine
    container_name: raushni-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raushni_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: raushni-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: raushni-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/raushni_backend
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      REQUIRE_AUTH: "false"
      INTERNAL_API_KEY: localdev-internal-api-key-xxxxxxxx
      CMS_API_TOKEN: localdev-cms-api-token-xxxxxxxxxxxx
      APP_PUBLIC_URL: http://localhost:3000
      ALEMBIC_AUTO_UPGRADE: "true"
      OTEL_SDK_DISABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: raushni-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CMS_URL: http://localhost:1337
      NEXT_PUBLIC_REQUIRE_AUTH: "false"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-nextauth-secret-32chars!!
      NEXTAUTH_ADMIN_EMAIL: admin@raushni.com
      NEXTAUTH_ADMIN_PASSWORD: LocalDevAdminPass1!
      NEXTAUTH_STAFF_EMAIL: staff@raushni.com
      NEXTAUTH_STAFF_PASSWORD: LocalDevStaffPass1!
      API_INTERNAL_URL: http://backend:8000
      INTERNAL_API_KEY: localdev-internal-api-key-xxxxxxxx
      OTEL_SDK_DISABLED: "true"
    depends_on:
      - backend
    command: sh -c "rm -rf .next && npm run dev"

volumes:
  postgres_data: