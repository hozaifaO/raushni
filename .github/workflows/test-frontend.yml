name: Frontend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linting
        run: |
          cd frontend
          npm run lint

      - name: Run type checking
        run: |
          cd frontend
          npm run type-check

      - name: Run unit tests
        run: |
          cd frontend
          npm run test:ci
        env:
          CI: true

      - name: Run build test
        run: |
          cd frontend
          npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-nextauth-secret-at-least-32-chars
          NEXTAUTH_ADMIN_EMAIL: admin@raushni.com
          NEXTAUTH_ADMIN_PASSWORD: ci-admin-password-not-for-prod
          NEXT_PUBLIC_REQUIRE_AUTH: "false"

      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          directory: frontend/coverage
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
