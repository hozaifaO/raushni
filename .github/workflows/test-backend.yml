name: Backend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/test-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/test-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: raushni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run linting
        run: |
          cd backend
          flake8 app tests
          black --check app tests
          isort --check-only app tests

      - name: Run type checking
        run: |
          cd backend
          mypy

      - name: Run tests with coverage
        working-directory: backend
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/raushni_test
          REDIS_URL: redis://localhost:6379
          ENVIRONMENT: testing
          REQUIRE_AUTH: "false"
          ALEMBIC_AUTO_UPGRADE: "true"
          OTEL_SDK_DISABLED: "true"
          INTERNAL_API_KEY: test-internal-api-key-32chars-ok!!
          CMS_API_TOKEN: test-cms-api-token-32chars-ok!!!!!

      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
