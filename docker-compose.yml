services:
  # PostgreSQL Database
  postgres:
    build: ./database
    container_name: raushni-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/backups:/backups
    networks:
      - raushni_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: raushni-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - raushni_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: raushni-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/raushni_backend}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CMS_INTERNAL_URL: ${CMS_INTERNAL_URL:-http://strapi:1337}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      DD_ENV: ${DD_ENV:-production}
      DD_SERVICE: raushni-backend
      DD_VERSION: ${DD_VERSION:-1.0.0}
      OTEL_SERVICE_NAME: raushni-backend
      OTEL_SERVICE_VERSION: ${DD_VERSION:-1.0.0}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DD_ENV:-production},service.namespace=raushni
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - raushni_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # CMS (Strapi)
  strapi:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: raushni-strapi
    ports:
      - "1337:1337"
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: production
      PUBLIC_URL: ${CMS_PUBLIC_URL:-http://localhost:1337}
      ADMIN_URL: ${STRAPI_ADMIN_URL:-http://localhost:1337/admin}
      APP_KEYS: ${STRAPI_APP_KEYS:-replace-with-four-comma-separated-production-keys}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:-replace-with-production-api-token-salt}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:-replace-with-production-admin-jwt-secret}
      JWT_SECRET: ${STRAPI_JWT_SECRET:-replace-with-production-jwt-secret}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:-replace-with-production-transfer-token-salt}
      CORS_ORIGINS: ${CMS_CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:1337,http://localhost:3000,http://localhost:3001}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${CMS_DATABASE_NAME:-raushni_cms}
      DATABASE_USERNAME: ${CMS_DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${CMS_DATABASE_PASSWORD:-postgres}
      DATABASE_SSL: ${CMS_DATABASE_SSL:-false}
      DD_ENV: ${DD_ENV:-production}
      DD_SERVICE: raushni-cms
      DD_VERSION: ${DD_VERSION:-1.0.0}
      NODE_OPTIONS: ${CMS_NODE_OPTIONS:---require @opentelemetry/auto-instrumentations-node/register}
      OTEL_SERVICE_NAME: raushni-cms
      OTEL_SERVICE_VERSION: ${DD_VERSION:-1.0.0}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DD_ENV:-production},service.namespace=raushni
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - raushni_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1337/_health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: raushni-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_PYTHON_URL: ${NEXT_PUBLIC_PYTHON_URL:-http://localhost:8000}
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-http://localhost:1337}
      NEXT_PUBLIC_REQUIRE_AUTH: ${NEXT_PUBLIC_REQUIRE_AUTH:-false}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-replace-with-local-nextauth-secret}
      NEXTAUTH_ADMIN_EMAIL: ${NEXTAUTH_ADMIN_EMAIL:-admin@raushni.com}
      NEXTAUTH_ADMIN_PASSWORD: ${NEXTAUTH_ADMIN_PASSWORD:-ChangeMe@12345}
      NEXTAUTH_STAFF_EMAIL: ${NEXTAUTH_STAFF_EMAIL:-staff@raushni.com}
      NEXTAUTH_STAFF_PASSWORD: ${NEXTAUTH_STAFF_PASSWORD:-ChangeMe@12345}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
      CMS_INTERNAL_URL: ${CMS_INTERNAL_URL:-http://strapi:1337}
      NODE_ENV: ${NODE_ENV:-development}
      DD_ENV: ${DD_ENV:-production}
      DD_SERVICE: raushni-frontend
      DD_VERSION: ${DD_VERSION:-1.0.0}
      OTEL_SERVICE_NAME: raushni-frontend
      OTEL_SERVICE_VERSION: ${DD_VERSION:-1.0.0}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DD_ENV:-production},service.namespace=raushni
    depends_on:
      backend:
        condition: service_started
      strapi:
        condition: service_healthy
    networks:
      - raushni_network
    command: sh -c "rm -rf .next && test -f 'app/(public)/activities/page.tsx' && test -f 'app/(public)/news/page.tsx' && test -f 'app/(dashboard)/dashboard/internships/page.tsx' && npm run dev"

  # Nginx Reverse Proxy
  nginx:
    build: ./nginx
    container_name: raushni-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
      - strapi
      - document-generator
    networks:
      - raushni_network

  # Document generation microservice
  document-generator:
    build:
      context: ./services/document_generator
      dockerfile: Dockerfile
    container_name: raushni-document-generator
    ports:
      - "8001:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DD_ENV: ${DD_ENV:-production}
      DD_SERVICE: raushni-document-generator
      DD_VERSION: ${DD_VERSION:-1.0.0}
      OTEL_SERVICE_NAME: raushni-document-generator
      OTEL_SERVICE_VERSION: ${DD_VERSION:-1.0.0}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DD_ENV:-production},service.namespace=raushni
    networks:
      - raushni_network

  # OpenTelemetry Collector -> Datadog exporter
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: raushni-otel-collector
    profiles:
      - monitoring
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: ${DD_HOSTNAME:-raushni-docker}
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    networks:
      - raushni_network

  # Datadog Agent for host/container monitoring and optional direct OTLP ingestion
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: raushni-datadog-agent
    profiles:
      - monitoring
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-production}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_APM_ENABLED: ${DD_APM_ENABLED:-true}
      DD_LOGS_ENABLED: ${DD_LOGS_ENABLED:-true}
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: ${DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL:-true}
      DD_PROCESS_AGENT_ENABLED: ${DD_PROCESS_AGENT_ENABLED:-true}
      DD_DOCKER_LABELS_AS_TAGS: '{"com.docker.compose.service":"compose_service"}'
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: 0.0.0.0:4317
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: 0.0.0.0:4318
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - raushni_network

volumes:
  postgres_data:
  redis_data:
  strapi_uploads:

networks:
  raushni_network:
    driver: bridge
