services:
  # PostgreSQL Database
  postgres:
    build: ./database
    container_name: raushni-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/backups:/backups
    networks:
      - raushni_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: raushni-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - raushni_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: raushni-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/raushni_backend}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - raushni_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # CMS (Strapi)
  strapi:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: raushni-strapi
    ports:
      - "1337:1337"
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: production
      PUBLIC_URL: ${CMS_PUBLIC_URL:-http://localhost:1337}
      APP_KEYS: ${STRAPI_APP_KEYS:-replace-with-four-comma-separated-production-keys}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:-replace-with-production-api-token-salt}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:-replace-with-production-admin-jwt-secret}
      JWT_SECRET: ${STRAPI_JWT_SECRET:-replace-with-production-jwt-secret}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:-replace-with-production-transfer-token-salt}
      CORS_ORIGINS: ${CMS_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${CMS_DATABASE_NAME:-raushni_cms}
      DATABASE_USERNAME: ${CMS_DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${CMS_DATABASE_PASSWORD:-postgres}
      DATABASE_SSL: ${CMS_DATABASE_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - raushni_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1337/_health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: raushni-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_PYTHON_URL: ${NEXT_PUBLIC_PYTHON_URL:-http://localhost:8000}
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-http://localhost:1337}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
      CMS_INTERNAL_URL: ${CMS_INTERNAL_URL:-http://strapi:1337}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      backend:
        condition: service_started
      strapi:
        condition: service_healthy
    networks:
      - raushni_network
    command: sh -c "rm -rf .next && test -f 'app/(dashboard)/activities/page.tsx' && test -f 'app/(dashboard)/news/page.tsx' && npm run dev"

  # Nginx Reverse Proxy
  nginx:
    build: ./nginx
    container_name: raushni-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
      - strapi
    networks:
      - raushni_network

volumes:
  postgres_data:
  redis_data:
  strapi_uploads:

networks:
  raushni_network:
    driver: bridge
