version: "3.8"

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raushni-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot
    environment:
      NGINX_SSL_CN: raushni.local
    networks:
      - raushni_proxy

networks:
  raushni_proxy:
    name: raushni_network
    external: true
