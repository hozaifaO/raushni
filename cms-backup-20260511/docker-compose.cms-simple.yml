services:
  postgres:
    image: postgres:15-alpine
    container_name: raushni-cms-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL data on external drive
      - /Volumes/owsd1/raushni/cms/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cms-network

  strapi:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: raushni-cms
    ports:
      - "1337:1337"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      NODE_ENV: development
      APP_KEYS: "key1,key2,key3,key4"
      ADMIN_JWT_SECRET: "admin-jwt-secret-change-me"
      API_TOKEN_SALT: "api-token-salt-change-me"
      JWT_SECRET: "jwt-secret-change-me"
      TRANSFER_TOKEN_SALT: "transfer-token-salt"
    volumes:
      # Core CMS data on external drive
      - /Volumes/owsd1/raushni/cms/uploads:/app/public/uploads
      - /Volumes/owsd1/raushni/cms/config:/app/config
      - /Volumes/owsd1/raushni/cms/api:/app/src/api

      # Logs and temp files
      - /Volumes/owsd1/raushni/cms/logs:/app/logs
      - /Volumes/owsd1/raushni/cms/temp:/app/.temp

      # Optional: Persist node_modules for faster startups
      - /Volumes/owsd1/raushni/cms/node_modules_cache:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cms-network

  # Optional: Backup service
  backup:
    image: alpine:latest
    container_name: raushni-cms-backup
    volumes:
      - /Volumes/owsd1/raushni/cms:/data
      - /Volumes/owsd1/raushni/backups:/backups
    command: |
      sh -c "
      while true; do
        tar -czf /backups/daily/backup-\$(date +%Y%m%d).tar.gz /data 2>/dev/null || true
        rm -f /backups/daily/backup-\$(date +%Y%m%d --date='7 days ago').tar.gz 2>/dev/null || true
        sleep 86400
      done"
    restart: unless-stopped
    networks:
      - cms-network

networks:
  cms-network:
    driver: bridge