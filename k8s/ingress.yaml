apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raushni-public
  namespace: raushni
  labels:
    app.kubernetes.io/name: raushni-public
    app.kubernetes.io/part-of: raushni-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
spec:
  tls:
    - hosts:
        - raushni.com
        - www.raushni.com
        - api.raushni.com
        - cms.raushni.com
      secretName: raushni-tls
  rules:
    - host: raushni.com
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /cms/api
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /api/cms
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /api/revalidate
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /api/upload
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /api/webhook
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: strapi
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
    - host: www.raushni.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
    - host: api.raushni.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
    - host: cms.raushni.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: strapi
                port:
                  name: http
