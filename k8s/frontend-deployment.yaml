apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: raushni
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: raushni-platform
    app.kubernetes.io/component: web
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: raushni-platform
        app.kubernetes.io/component: web
      annotations:
        ad.datadoghq.com/frontend.logs: '[{"source":"nodejs","service":"raushni-frontend"}]'
    spec:
      serviceAccountName: raushni-app
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/owais4u/raushni-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: raushni-config
          env:
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: NEXTAUTH_SECRET
            - name: NEXTAUTH_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: NEXTAUTH_ADMIN_EMAIL
            - name: NEXTAUTH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: NEXTAUTH_ADMIN_PASSWORD
            - name: NEXTAUTH_STAFF_EMAIL
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: NEXTAUTH_STAFF_EMAIL
            - name: NEXTAUTH_STAFF_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: NEXTAUTH_STAFF_PASSWORD
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: INTERNAL_API_KEY
            - name: CMS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: CMS_API_TOKEN
            - name: DD_SERVICE
              value: raushni-frontend
            - name: OTEL_SERVICE_NAME
              value: raushni-frontend
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: raushni
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: raushni
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: raushni
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
