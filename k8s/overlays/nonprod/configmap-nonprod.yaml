apiVersion: v1
kind: ConfigMap
metadata:
  name: raushni-config
  namespace: raushni
data:
  ENVIRONMENT: nonprod
  DD_ENV: nonprod
  APP_PUBLIC_URL: https://raushni-dev.com
  API_PUBLIC_URL: https://api.raushni-dev.com
  CMS_PUBLIC_URL: https://cms.raushni-dev.com
  NEXTAUTH_URL: https://raushni-dev.com
  NEXT_PUBLIC_API_URL: https://api.raushni-dev.com
  NEXT_PUBLIC_CMS_URL: https://cms.raushni-dev.com
  CMS_CORS_ORIGINS: https://raushni-dev.com,https://www.raushni-dev.com,https://api.raushni-dev.com,https://cms.raushni-dev.com
  KEYCLOAK_ISSUER: https://auth.raushni-dev.com/realms/raushni
  KEYCLOAK_PUBLIC_ISSUER: https://auth.raushni-dev.com/realms/raushni
  OIDC_ISSUER: https://auth.raushni-dev.com/realms/raushni
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=nonprod,service.namespace=raushni

