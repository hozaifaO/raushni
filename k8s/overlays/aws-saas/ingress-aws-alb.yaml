apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raushni-public
  namespace: raushni
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:301142909770:certificate/REPLACE_WITH_ACM_CERTIFICATE_ID
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/group.name: raushni-saas
    alb.ingress.kubernetes.io/tags: Project=raushni,Environment=production,Product=ngo-saas
spec:
  ingressClassName: alb
  tls: []
  rules:
    - host: raushni.com
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /api/cms
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /api/revalidate
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /api/upload
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /api/webhook
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: strapi
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
    - host: www.raushni.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
    # Tenant subdomains → frontend (Next.js middleware resolves slug).
    # ACM certificate must include *.raushni.com (see docs/MULTI_TENANT.md).
    - host: "*.raushni.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
    - host: api.raushni.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
    - host: cms.raushni.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: strapi
                port:
                  name: http
