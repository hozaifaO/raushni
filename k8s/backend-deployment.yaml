apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: raushni
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: raushni-platform
    app.kubernetes.io/component: api
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: raushni-platform
        app.kubernetes.io/component: api
      annotations:
        ad.datadoghq.com/backend.logs: '[{"source":"python","service":"raushni-backend"}]'
    spec:
      serviceAccountName: raushni-app
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/owais4u/raushni-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: raushni-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: BACKEND_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: REDIS_URL
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: STRIPE_PUBLISHABLE_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: INTERNAL_API_KEY
            - name: CMS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: CMS_API_TOKEN
            - name: DD_SERVICE
              value: raushni-backend
            - name: OTEL_SERVICE_NAME
              value: raushni-backend
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: raushni
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: raushni-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: raushni
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: raushni
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
