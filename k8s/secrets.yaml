apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: raushni-secrets
  namespace: raushni
  labels:
    app.kubernetes.io/name: raushni
    app.kubernetes.io/part-of: raushni-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: raushni-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: raushni
          app.kubernetes.io/part-of: raushni-platform
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: /raushni/production/app
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /raushni/production/app
        property: POSTGRES_PASSWORD
    - secretKey: BACKEND_DATABASE_URL
      remoteRef:
        key: /raushni/production/app
        property: BACKEND_DATABASE_URL
    - secretKey: CMS_DATABASE_NAME
      remoteRef:
        key: /raushni/production/app
        property: CMS_DATABASE_NAME
    - secretKey: CMS_DATABASE_HOST
      remoteRef:
        key: /raushni/production/app
        property: CMS_DATABASE_HOST
    - secretKey: CMS_DATABASE_PORT
      remoteRef:
        key: /raushni/production/app
        property: CMS_DATABASE_PORT
    - secretKey: CMS_DATABASE_USERNAME
      remoteRef:
        key: /raushni/production/app
        property: CMS_DATABASE_USERNAME
    - secretKey: CMS_DATABASE_PASSWORD
      remoteRef:
        key: /raushni/production/app
        property: CMS_DATABASE_PASSWORD
    - secretKey: CMS_DATABASE_SSL
      remoteRef:
        key: /raushni/production/app
        property: CMS_DATABASE_SSL
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: /raushni/production/app
        property: REDIS_PASSWORD
    - secretKey: REDIS_URL
      remoteRef:
        key: /raushni/production/app
        property: REDIS_URL
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: /raushni/production/app
        property: NEXTAUTH_SECRET
    - secretKey: NEXTAUTH_ADMIN_EMAIL
      remoteRef:
        key: /raushni/production/app
        property: NEXTAUTH_ADMIN_EMAIL
    - secretKey: NEXTAUTH_ADMIN_PASSWORD
      remoteRef:
        key: /raushni/production/app
        property: NEXTAUTH_ADMIN_PASSWORD
    - secretKey: NEXTAUTH_STAFF_EMAIL
      remoteRef:
        key: /raushni/production/app
        property: NEXTAUTH_STAFF_EMAIL
    - secretKey: NEXTAUTH_STAFF_PASSWORD
      remoteRef:
        key: /raushni/production/app
        property: NEXTAUTH_STAFF_PASSWORD
    - secretKey: INTERNAL_API_KEY
      remoteRef:
        key: /raushni/production/app
        property: INTERNAL_API_KEY
    - secretKey: CMS_API_TOKEN
      remoteRef:
        key: /raushni/production/app
        property: CMS_API_TOKEN
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: /raushni/production/app
        property: STRIPE_SECRET_KEY
    - secretKey: STRIPE_PUBLISHABLE_KEY
      remoteRef:
        key: /raushni/production/app
        property: STRIPE_PUBLISHABLE_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: /raushni/production/app
        property: STRIPE_WEBHOOK_SECRET
    - secretKey: STRAPI_APP_KEYS
      remoteRef:
        key: /raushni/production/app
        property: STRAPI_APP_KEYS
    - secretKey: STRAPI_API_TOKEN_SALT
      remoteRef:
        key: /raushni/production/app
        property: STRAPI_API_TOKEN_SALT
    - secretKey: STRAPI_ADMIN_JWT_SECRET
      remoteRef:
        key: /raushni/production/app
        property: STRAPI_ADMIN_JWT_SECRET
    - secretKey: STRAPI_JWT_SECRET
      remoteRef:
        key: /raushni/production/app
        property: STRAPI_JWT_SECRET
    - secretKey: STRAPI_TRANSFER_TOKEN_SALT
      remoteRef:
        key: /raushni/production/app
        property: STRAPI_TRANSFER_TOKEN_SALT
    - secretKey: DD_API_KEY
      remoteRef:
        key: /raushni/production/app
        property: DD_API_KEY
