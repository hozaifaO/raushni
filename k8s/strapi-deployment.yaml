apiVersion: apps/v1
kind: Deployment
metadata:
  name: strapi
  namespace: raushni
  labels:
    app.kubernetes.io/name: strapi
    app.kubernetes.io/part-of: raushni-platform
    app.kubernetes.io/component: cms
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: strapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strapi
        app.kubernetes.io/part-of: raushni-platform
        app.kubernetes.io/component: cms
      annotations:
        ad.datadoghq.com/strapi.logs: '[{"source":"nodejs","service":"raushni-cms"}]'
    spec:
      serviceAccountName: raushni-app
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: strapi
          image: ghcr.io/owais4u/raushni-cms:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 1337
          envFrom:
            - configMapRef:
                name: raushni-config
          env:
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: raushni-config
                  key: STRAPI_HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: raushni-config
                  key: STRAPI_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: raushni-config
                  key: STRAPI_NODE_ENV
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: raushni-config
                  key: CMS_PUBLIC_URL
            - name: DATABASE_CLIENT
              value: postgres
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: CMS_DATABASE_NAME
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: CMS_DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: CMS_DATABASE_PASSWORD
            - name: DATABASE_SSL
              value: "false"
            - name: APP_KEYS
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: STRAPI_APP_KEYS
            - name: API_TOKEN_SALT
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: STRAPI_API_TOKEN_SALT
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: STRAPI_ADMIN_JWT_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: STRAPI_JWT_SECRET
            - name: TRANSFER_TOKEN_SALT
              valueFrom:
                secretKeyRef:
                  name: raushni-secrets
                  key: STRAPI_TRANSFER_TOKEN_SALT
            - name: DD_SERVICE
              value: raushni-cms
            - name: OTEL_SERVICE_NAME
              value: raushni-cms
            - name: NODE_OPTIONS
              value: --require @opentelemetry/auto-instrumentations-node/register
          volumeMounts:
            - name: strapi-uploads
              mountPath: /opt/app/public/uploads
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: strapi-uploads
          persistentVolumeClaim:
            claimName: strapi-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: strapi-uploads
  namespace: raushni
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: strapi
  namespace: raushni
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: strapi
  ports:
    - name: http
      port: 1337
      targetPort: http
