services:
  postgres:
    image: postgres:15-alpine
    container_name: raushni-cms-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - cms-network

  strapi:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: raushni-cms
    ports:
      - "1337:1337"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      NODE_ENV: development
      APP_KEYS: "key1_1234567890abcdef,key2_1234567890abcdef,key3_1234567890abcdef,key4_1234567890abcdef"
      ADMIN_JWT_SECRET: "admin-jwt-secret-32-chars-long-string"
      API_TOKEN_SALT: "api-token-salt-32-chars-long-secure"
      JWT_SECRET: "jwt-secret-32-chars-long-very-secure"
      TRANSFER_TOKEN_SALT: "transfer-token-salt-secure"
    volumes:
      - /Volumes/owsd1/raushni/cms/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cms-network

volumes:
  postgres_data:

networks:
  cms-network:
    driver: bridge