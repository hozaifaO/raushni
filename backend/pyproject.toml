[tool.poetry]
name = "raushni-backend"
version = "1.0.0"
description = "Raushni NGO Management Backend API"
authors = ["Owais <owais@raushni.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.23"
asyncpg = "^0.29.0"
greenlet = "^3.0.0"
alembic = "^1.12.1"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-multipart = "^0.0.6"
redis = "^5.0.1"
slowapi = "^0.1.9"
stripe = "^7.5.0"
qrcode = "^7.4.2"
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-otlp = "^1.27.0"
opentelemetry-instrumentation-fastapi = "^0.48b0"
opentelemetry-instrumentation-logging = "^0.48b0"
opentelemetry-instrumentation-redis = "^0.48b0"
opentelemetry-instrumentation-sqlalchemy = "^0.48b0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"
ipython = "^8.17.2"
pre-commit = "^3.5.0"
httpx = "^0.25.1"

[tool.poetry.group.mail]
optional = true

[tool.poetry.group.mail.dependencies]
aiosmtplib = "^2.0.2"

[tool.poetry.group.pdf]
optional = true

[tool.poetry.group.pdf.dependencies]
reportlab = "^4.0.4"

[tool.poetry.scripts]
raushni = "app.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["app/core", "app/models", "app/repositories", "app/schemas"]
